name: Airtable Listings Sync

on:
  repository_dispatch:
    types: [airtable_changed]
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: airtable-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID || vars.AIRTABLE_BASE_ID || '' }}
      AIRTABLE_TABLE_NAME: ${{ vars.AIRTABLE_TABLE_NAME || 'Listings' }}
      AIRTABLE_VIEW_NAME: ${{ vars.AIRTABLE_VIEW_NAME || '' }}
      AIRTABLE_MAX_RECORDS: ${{ vars.AIRTABLE_MAX_RECORDS || '0' }}
      AIRTABLE_FETCH_MAX_RETRIES: ${{ vars.AIRTABLE_FETCH_MAX_RETRIES || '4' }}
      AIRTABLE_FETCH_TIMEOUT_MS: ${{ vars.AIRTABLE_FETCH_TIMEOUT_MS || '20000' }}
      AIRTABLE_FETCH_BASE_BACKOFF_MS: ${{ vars.AIRTABLE_FETCH_BASE_BACKOFF_MS || '1000' }}
      AIRTABLE_AREAS_TABLE_NAME: ${{ vars.AIRTABLE_AREAS_TABLE_NAME || 'Areas' }}
      AIRTABLE_AREA_QUESTIONS_TABLE_NAME: ${{ vars.AIRTABLE_AREA_QUESTIONS_TABLE_NAME || 'Area Questions' }}
      AIRTABLE_LEADS_TABLE_NAME: ${{ vars.AIRTABLE_LEADS_TABLE_NAME || 'Leads' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase on latest main
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Airtable config
        run: |
          missing=0
          if [ -z "${AIRTABLE_API_KEY}" ]; then
            echo "::error title=Missing AIRTABLE_API_KEY::Set repository secret AIRTABLE_API_KEY."
            missing=1
          fi
          if [ -z "${AIRTABLE_BASE_ID}" ]; then
            echo "::error title=Missing AIRTABLE_BASE_ID::Set repository secret AIRTABLE_BASE_ID (recommended) or repository variable AIRTABLE_BASE_ID."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Fetch Airtable data
        run: node scripts/fetch-airtable-data.js

      - name: Fetch Airtable support data
        run: node scripts/fetch-airtable-support-data.js

      - name: Push queued WhatsApp leads to Airtable
        run: node scripts/push-whatsapp-leads.js

      - name: Detect JSON change
        id: detect_change
        run: |
          if [ -z "$(git status --porcelain -- data/listings.json data/areas.json data/area-questions.json data/whatsapp-leads.json data/loan-leads.json data/insurance-leads.json data/listing-images property-share)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.detect_change.outputs.changed == 'true'
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json data/areas.json data/area-questions.json data/whatsapp-leads.json data/loan-leads.json data/insurance-leads.json data/listing-images property-share
          if git diff --cached --quiet; then
            echo "No sync changes detected."
            exit 0
          fi
          git commit -m "chore: sync Airtable data and queued leads"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            AHEAD_COUNT="$(git rev-list --count "origin/$BRANCH..HEAD")"
            if [ "${AHEAD_COUNT}" -eq 0 ]; then
              echo "Nothing to push after rebase; remote already has equivalent changes."
              exit 0
            fi
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi
            echo "Push rejected (likely non-fast-forward). Rebasing and retrying ($attempt/3)..."
            git pull --rebase origin "$BRANCH"
          done

      - name: No-op summary
        if: steps.detect_change.outputs.changed != 'true'
        run: echo "No sync file changes detected."
