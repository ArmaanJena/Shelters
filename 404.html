<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Shelters Realty</title>
    <meta name="description" content="The page you are looking for could not be found. Go back to Shelters Realty home or browse listings.">
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="https://www.sheltersrealty.co.in/404.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --accent: #0f766e;
            --accent-hover: #115e59;
            --border: #dbe7f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Lora", serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, #d1fae5 0%, transparent 42%),
                radial-gradient(circle at bottom left, #e2e8f0 0%, transparent 48%),
                var(--bg);
            display: grid;
            place-items: center;
            padding: 1rem;
        }

        .card {
            width: min(680px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 24px 50px rgba(15, 23, 42, 0.08);
        }

        .code {
            display: inline-block;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: "Playfair Display", serif;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            line-height: 1.15;
            margin-bottom: 0.9rem;
        }

        p {
            color: var(--muted);
            font-size: clamp(1rem, 2.6vw, 1.1rem);
            line-height: 1.6;
        }

        .path {
            margin-top: 1rem;
            font-size: 0.92rem;
            color: #334155;
            word-break: break-word;
        }

        .path code {
            background: #f1f5f9;
            border: 1px solid #dbe7f1;
            border-radius: 8px;
            padding: 0.2rem 0.4rem;
        }

        .actions {
            margin-top: 1.6rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .btn {
            text-decoration: none;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-weight: 600;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 10px 22px rgba(15, 118, 110, 0.2);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #fff;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
        }

        @media (max-width: 640px) {
            .card {
                padding: 1.4rem;
                border-radius: 16px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="card" aria-labelledby="not-found-title">
        <span class="code">404 Error</span>
        <h1 id="not-found-title">This page does not exist.</h1>
        <p>The link may be broken or the page may have moved. Use one of the options below to continue.</p>
        <p class="path">Requested path: <code id="requested-path">/</code></p>
        <div class="actions">
            <a class="btn btn-primary" href="/">Go to Homepage</a>
            <a class="btn btn-secondary" href="/listings/">View Listings</a>
        </div>
    </main>
    <script>
        (function () {
            var node = document.getElementById('requested-path');
            if (!node) return;
            var path = window.location.pathname + window.location.search + window.location.hash;
            node.textContent = path || '/';
        })();
    </script>
</body>
</html>
